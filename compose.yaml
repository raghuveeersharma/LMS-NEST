version: '3.9'
services:
  mongo:
    image: mongo:7.0
    container_name: new_nest_mongo
    restart: unless-stopped
    ports:
      - '27018:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    name: new_nest_mongo_data